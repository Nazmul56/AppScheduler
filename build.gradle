// Project-level build.gradle

buildscript {
    ext {
        kotlin_version = '1.9.0'       // Latest Kotlin version (2025 approx)
        agp_version = '8.9.0-alpha07'           // Android Gradle Plugin latest stable
        room_version = '2.5.2'          // Latest Room stable
        lifecycle_version = '2.6.2'     // Lifecycle latest
        coroutines_version = '1.7.3'    // Coroutines latest
        recyclerview_version = '1.3.1'  // RecyclerView latest
        material_version = '1.9.0'      // Material Components latest
        compose_version = '1.5.0'       // Compose latest
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath libs.com.google.devtools.ksp.gradle.plugin // Add this line
        classpath libs.hilt.android.gradle.plugin.v248

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
